name: hatsu-yakitori
version: 0.0.3.0
synopsis: Shake-based build system for Chicken Scheme project
description: Shake + Chicken Scheme integration
author: Yoshihiro Hasegawa
maintainer: je-suis-1oeuf-devautour@proton.me
license: BSD3

executables:
  shake:
    main: Shake.hs
    source-dirs: shake
    dependencies:
      - base
      - shake
      - extra  
      - async
      - process
      - directory
      - filepath
      - containers
      - bytestring
      - binary
      - hashable
      - sbv
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    other-modules:
      - Chicken
      - Clean
      - Pipeline
      - Salmonella
      - SourceIO
      - Rules.Compile
      - Rules.DebFMM
      - Rules.Link
      - Rules.HDF5
      - Rules.MEEP
      - Rules.Quadcopter
      - Rules.StandardToplevel
      - Rules.Wasm
      - Rules.Proof.LLVM_IR
      - Rules.Proof.Lean4
      - Rules.Proof.Main
      - Rules.Proof.SBV_Bridge


github: Yoshyhyrro/hatsu-yakitori