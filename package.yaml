name: hatsu-yakitori
version: 0.0.2.0
synopsis: Shake-based build system for Chicken Scheme project
description: Polysemy + Shake + Chicken Scheme integration
author: Yoshihiro Hasegawa
maintainer: je-suis-1oeuf-devautour@proton.me
license: BSD3

data-files:
  - shake/mock_test/mlir/flang.dhall

executables:
  shake:
    main: Shake.hs
    source-dirs: shake
    dependencies:
      - base
      - polysemy
      - polysemy-plugin
      - shake
      - extra  
      - async
      - process
      - directory
      - filepath
      - containers
      - bytestring
      - binary
      - hashable
      - sbv
      - dhall
      - text
      - with-utf8
    ghc-options:
      - -fplugin=Polysemy.Plugin
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    other-modules:
      - Chicken
      - Diag
      - Rules.Proof.Flang
      - Clean
      - Pipeline
      - Salmonella
      - SourceIO
      - Rules.Compile
      - Rules.DebFMM
      - Rules.GC
      - Rules.Link
      - Rules.HDF5
      - Rules.MEEP
      - Rules.Quadcopter
      - Rules.StandardToplevel
      - Rules.Wasm
      - Rules.Proof.LLVM_IR
      - Rules.Proof.FlangDhall
      - Rules.Proof.Lean4
      - Rules.Proof.Main
      - Rules.Proof.SBV_Bridge


github: Yoshyhyrro/hatsu-yakitori

tests:
  flang-dhall-spec:
    main: FlangDhallSpec.hs
    source-dirs:
      - tests
      - shake
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - hspec
      - dhall
      - text
      - with-utf8
      - bytestring
      - containers
      - async
