name: FMM Debian Release

on:
  pull_request:
    paths:
      - '.github/workflows/fmm-deb-release.yml'
      - 'examples/fmm/**'
      - 'LICENSE'
      - 'core/**'
      - 'modules/fmm/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
  push:
    branches:
      - main
      - 'hotfix/**'
      - feature/fmm_classroom_rpc_actions
      - feature/example/input_HDF5_fmm-deb-ci
      - 'release/**'
    tags:
      # Keep Debian spin-off releases separate from the main egg v* releases.
      - 'fmm-v*'
    paths:
      - '.github/workflows/fmm-deb-release.yml'
      - 'examples/fmm/**'
      - 'LICENSE'
      - 'core/**'
      - 'modules/fmm/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
  workflow_dispatch:
    inputs:
      deb_version:
        description: 'Optional package version to build (overrides tag)'
        required: false
        default: '0.4.9'
      deb_arch:
        description: 'Target Debian architecture (amd64, arm64)'
        required: false
        default: 'amd64'
      deb_package_name:
        description: 'Debian package name (defaults to hatsu-fmm)'
        required: false
        default: 'hatsu-fmm'

permissions:
  contents: read

jobs:
  build-deb:
    name: Build FMM .deb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Guard docs against hardcoded FMM release tags
        run: |
          set -euo pipefail

          offenders="$(grep -nE 'fmm-v[0-9]+(\.[0-9]+)*' README.md pages/index.html || true)"
          if [ -n "$offenders" ]; then
            echo "Hardcoded fmm-v* tag found in docs. Use releases/latest/download instead:"
            echo "$offenders"
            exit 1
          fi

          for file in README.md pages/index.html; do
            if ! grep -q 'releases/latest/download/hatsu-fmm_' "$file"; then
              echo "Expected releases/latest/download URL not found in $file"
              exit 1
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential chicken-bin dpkg-dev apt-utils gnupg haskell-stack libhdf5-dev hdf5-tools

      - name: Determine DEB_VERSION/DEB_ARCH/DEB_PACKAGE_NAME
        run: |
          set -euo pipefail
          # Use explicit workflow input if provided
          if [ -n "${{ github.event.inputs.deb_version || '' }}" ]; then
            echo "DEB_VERSION=${{ github.event.inputs.deb_version }}" >> $GITHUB_ENV
          else
            tag="${GITHUB_REF_NAME:-}"
            if [[ "$tag" == fmm-v* ]]; then
              ver="${tag#fmm-v}"
              echo "DEB_VERSION=${ver}" >> $GITHUB_ENV
            else
              echo "DEB_VERSION=0.4.9" >> $GITHUB_ENV
            fi
          fi

          # Architecture
          if [ -n "${{ github.event.inputs.deb_arch || '' }}" ]; then
            echo "DEB_ARCH=${{ github.event.inputs.deb_arch }}" >> $GITHUB_ENV
          else
            echo "DEB_ARCH=amd64" >> $GITHUB_ENV
          fi

          # Package name
          if [ -n "${{ github.event.inputs.deb_package_name || '' }}" ]; then
            echo "DEB_PACKAGE_NAME=${{ github.event.inputs.deb_package_name }}" >> $GITHUB_ENV
          else
            echo "DEB_PACKAGE_NAME=hatsu-fmm" >> $GITHUB_ENV
          fi

      - name: Install CHICKEN egg dependencies
        run: sudo chicken-install srfi-1 srfi-69

      - name: Verify CHICKEN toolchain
        run: |
          which csc
          csc -version
          chicken-status srfi-1 srfi-69

      - name: Verify Stack
        run: stack --version

      - name: Build local shake executable
        run: stack build hatsu-yakitori:exe:shake

      - name: Check packaging environment
        run: stack exec shake -- fmm-release-check-env

      - name: Build staged package tree
        run: stack exec shake -- fmm-release-stage

      - name: Inspect staged package tree
        run: find dist/fmm-release -type f | sort

      - name: Build Debian package
        run: stack exec shake -- deb-fmm

      - name: Run SBV proof with mock HDF5
        # hdf5-tools is installed in the environment, so we can check for h5dump and run the proof with a mock HDF5 file if it exists.
        # Warning is emitted if the mock HDF5 file is missing, but the proof will still run without it (JCL philosophy).
        run: |
          H5="examples/fmm/plasma_landau_mock.h5"
          echo "MOCK_H5=$H5" >> "$GITHUB_ENV"
          if [ -f "$H5" ]; then
            echo "info[HYK002N]: running sbv-so-fmm with --hdf5 $H5"
            stack exec shake -- --hdf5 "$H5" sbv-so-fmm
          else
            echo "warning[HYK001W]: $H5 not found; running sbv-so-fmm without HDF5 input"
            stack exec shake -- sbv-so-fmm
          fi

      - name: Run Flang verify with mock HDF5
        run: |
          if [ -f "$MOCK_H5" ]; then
            echo "info[HYK009N]: running flang-verify with --hdf5 $MOCK_H5"
            stack exec shake -- --hdf5 "$MOCK_H5" --flang-src src/fortran flang-verify
          else
            echo "warning[HYK006W]: $MOCK_H5 not found; running flang-verify without HDF5 input"
            stack exec shake -- --flang-src src/fortran flang-verify
          fi

      - name: Inspect packaged outputs
        run: find dist -type f | sort

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hatsu-fmm-deb
          path: |
            dist/*.deb
            dist/fmm-release/pkgroot/**
          if-no-files-found: error

  publish-release:
    name: Publish .deb to GitHub Release
    runs-on: ubuntu-latest
    needs: build-deb
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Debian artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hatsu-fmm-deb
          path: release-assets

      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t debs < <(find release-assets -type f -name '*.deb' | sort)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No .deb artifact found to publish."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1 || gh release create "$tag" --repo "$GH_REPO" --title "$tag" --generate-notes
          gh release upload "$tag" "${debs[@]}" --repo "$GH_REPO" --clobber

  publish-apt-repo:
    name: Publish APT repository to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-deb
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release/fmm-deb-ci')
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout source branch for Pages UI assets
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: site-src

      - name: Checkout gh-pages branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: gh-pages
          path: apt-repo

      - name: Download .deb artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hatsu-fmm-deb
          path: deb-artifact

      - name: Sync Pages UI assets
        run: |
          cp site-src/pages/index.html apt-repo/index.html
          cp site-src/pages/styles.css apt-repo/styles.css
          cp site-src/pages/app.js apt-repo/app.js
          cp site-src/pages/.nojekyll apt-repo/.nojekyll

      - name: Import GPG key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import --import-options import-show

      - name: Build APT repo structure
        run: |
          set -euo pipefail
          REPO=apt-repo
          POOL=$REPO/pool/main
          DISTS=$REPO/dists/stable/main/binary-amd64

          mkdir -p "$POOL" "$DISTS"

          cp deb-artifact/*.deb "$POOL"/

          cd apt-repo
          dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          apt-ftparchive release dists/stable > dists/stable/Release

          gpg --batch --yes --armor --detach-sign \
            -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign \
            -o dists/stable/InRelease dists/stable/Release

      - name: Push to gh-pages
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "apt: update repository [ci skip]"
          git push origin gh-pages