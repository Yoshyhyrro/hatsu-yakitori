name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'ats2/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  push:
    branches:
      - example/ats2_build/output_flang←smt2_theory
    tags-ignore:
      - '*'
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'ats2/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmm-runtime-smoke:
    name: Run FMM Scheme smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: "Debug: write run marker"
        run: |
          echo "CI_RUN_ID=$GITHUB_RUN_ID" > ci-debug-marker.txt
          echo "JOB=$GITHUB_JOB" >> ci-debug-marker.txt
          date >> ci-debug-marker.txt

      - name: Upload ci-debug-marker
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-debug-marker-fmm-runtime-smoke
          path: ci-debug-marker.txt

      - name: Install CHICKEN
        run: |
          sudo apt-get update
          sudo apt-get install -y chicken-bin

      - name: Install ATS2 toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev wget ca-certificates

          if command -v patscc >/dev/null 2>&1; then
            patscc --version
          else
            mkdir -p "$HOME/.local/src"
            cd "$HOME/.local/src"
            curl -L -o ats2.tgz \
              "https://downloads.sourceforge.net/project/ats2-lang/ats2-lang/ats2-postiats-0.4.2/ATS2-Postiats-0.4.2.tgz"
            tar -xzf ats2.tgz
            cd ATS2-Postiats-*/
            ./configure --prefix="$HOME/.local/ats2"
            # Execute sequential make to prevent race conditions in copy/build/clean targets
            make
            make install
            echo "$HOME/.local/ats2/bin" >> "$GITHUB_PATH"
            "$HOME/.local/ats2/bin/patscc" --version
          fi

      - name: Install CHICKEN egg dependencies
        run: sudo chicken-install srfi-1 srfi-69

      - name: Install HDF5 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hdf5-tools

      - name: Install SMT solvers
        run: |
          sudo apt-get install -y z3
          z3 --version

      - name: Verify CHICKEN toolchain
        run: |
          which csc
          csc -version
          chicken-status srfi-1 srfi-69

      - name: Verify ATS2 + Shake integration
        run: |
          which patscc
          patscc --version
          stack --version
          stack build hatsu-yakitori:exe:shake --fast
          stack exec hatsu-yakitori:exe:shake -- ats2

      - name: Check mock HDF5 integrity
        run: |
          H5="examples/fmm/plasma_landau_mock.h5"
          if [ ! -f "$H5" ]; then
            echo "error[HYK001W]: examples/fmm/plasma_landau_mock.h5 not found"
            echo "   = note: regenerate with: python examples/fmm/gen_mock_plasma.py $H5"
            exit 1
          fi
          h5dump -H "$H5" | grep -q "goppa_grid" || {
            echo "error[HYK004E]: HDF5 file exists but goppa_grid group is missing"
            exit 1
          }
          echo "info[HYK005I]: HDF5 mock file OK"
          h5dump -H "$H5"

      - name: Build ATS2 kernel object
        run: |
          mkdir -p dist/obj_ats2
          if command -v patscc >/dev/null 2>&1; then
            patscc -c ats2/ats_kernel.dats -o dist/obj_ats2/ats_kernel.o
          else
            echo "skip ATS2 compile: patscc not installed"
          fi

      - name: Run FMM smoke test
        run: csi -s tests/fmm_tests.scm

  ats2-mock-registry:
    name: Build ATS2 mock registry
    runs-on: ubuntu-latest
    needs: fmm-runtime-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: "Debug: write run marker"
        run: |
          echo "CI_RUN_ID=$GITHUB_RUN_ID" > ci-debug-marker.txt
          echo "JOB=$GITHUB_JOB" >> ci-debug-marker.txt
          date >> ci-debug-marker.txt

      - name: Upload ci-debug-marker
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-debug-marker-ats2-mock-registry
          path: ci-debug-marker.txt

      - name: Install ATS2 toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev wget ca-certificates

          if command -v patscc >/dev/null 2>&1; then
            patscc --version
          else
            mkdir -p "$HOME/.local/src"
            cd "$HOME/.local/src"
            curl -L -o ats2.tgz \
              "https://downloads.sourceforge.net/project/ats2-lang/ats2-lang/ats2-postiats-0.4.2/ATS2-Postiats-0.4.2.tgz"
            tar -xzf ats2.tgz
            cd ATS2-Postiats-*/
            ./configure --prefix="$HOME/.local/ats2"
            # Execute sequential make to prevent race conditions in copy/build/clean targets
            make
            make install
            echo "$HOME/.local/ats2/bin" >> "$GITHUB_PATH"
            "$HOME/.local/ats2/bin/patscc" --version
          fi

      - name: Build ATS2 mock registry object
        run: |
          mkdir -p dist/obj_ats2
          patscc -c ats2/mock_test/flang.dats -o dist/obj_ats2/flang_mock.o

      - name: Upload ATS2 mock registry artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ats2-mock-registry
          path: dist/obj_ats2/flang_mock.o