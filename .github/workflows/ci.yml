name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  push:
    branches:
      - feature/example/output_flang
    tags-ignore:
      - '*'
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-fmm-gate:
    name: Build HatsuYakitori.FMM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: dist-proof/lean4
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: "Debug: write run marker"
        run: |
          echo "CI_RUN_ID=$GITHUB_RUN_ID" > ci-debug-marker.txt
          echo "JOB=$GITHUB_JOB" >> ci-debug-marker.txt
          date >> ci-debug-marker.txt

      - name: Upload ci-debug-marker
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-debug-marker-lean-fmm-gate
          path: ci-debug-marker.txt

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch dependency cache
        run: |
          lake update
          lake exe cache get

      - name: Build FMM proof gate
        run: lake build HatsuYakitori.FMM

      - name: Build HopfStructure proof target
        run: lake build HatsuYakitori.HopfStructure

  fmm-runtime-smoke:
    name: Run FMM Scheme smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: "Debug: write run marker"
        run: |
          echo "CI_RUN_ID=$GITHUB_RUN_ID" > ci-debug-marker.txt
          echo "JOB=$GITHUB_JOB" >> ci-debug-marker.txt
          date >> ci-debug-marker.txt

      - name: Upload ci-debug-marker
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-debug-marker-fmm-runtime-smoke
          path: ci-debug-marker.txt

      - name: Install CHICKEN
        run: |
          sudo apt-get update
          sudo apt-get install -y chicken-bin

      - name: Install CHICKEN egg dependencies
        run: sudo chicken-install srfi-1 srfi-69

      - name: Install HDF5 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hdf5-tools

      - name: Install SMT solvers
        run: |
          sudo apt-get install -y z3
          z3 --version

      - name: Verify CHICKEN toolchain
        run: |
          which csc
          csc -version
          chicken-status srfi-1 srfi-69

      - name: Check mock HDF5 integrity
        run: |
          H5="examples/fmm/plasma_landau_mock.h5"
          if [ ! -f "$H5" ]; then
            echo "error[HYK001W]: examples/fmm/plasma_landau_mock.h5 not found"
            echo "   = note: regenerate with: python examples/fmm/gen_mock_plasma.py $H5"
            exit 1
          fi
          h5dump -H "$H5" | grep -q "goppa_grid" || {
            echo "error[HYK004E]: HDF5 file exists but goppa_grid group is missing"
            exit 1
          }
          echo "info[HYK005I]: HDF5 mock file OK"
          h5dump -H "$H5"

      - name: Run FMM smoke test
        run: csi -s tests/fmm_tests.scm

  flang-dhall-emit:
    name: Emit Flang Dhall Diags
    runs-on: ubuntu-latest
    needs: fmm-runtime-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: "Debug: write run marker"
        run: |
          echo "CI_RUN_ID=$GITHUB_RUN_ID" > ci-debug-marker.txt
          echo "JOB=$GITHUB_JOB" >> ci-debug-marker.txt
          date >> ci-debug-marker.txt

      - name: Upload ci-debug-marker
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-debug-marker-flang-dhall-emit
          path: ci-debug-marker.txt

      - name: Install LLVM 17 and Flang
        run: |
          # apt.llvm.org から公式のインストールスクリプトを取得してLLVM 17を導入
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 all
          
          # flang-17 が必要な場合は追加でインストールを試行
          sudo apt-get install -y flang-17 || echo "flang-17 is already installed or unavailable"
          
          # インストールされた LLVM 17 ツールチェーンを PATH に追加
          echo "/usr/lib/llvm-17/bin" >> $GITHUB_PATH

      - name: Verify LLVM 17 Installation
        run: |
          clang-17 --version
          if command -v flang-17 &> /dev/null; then
            flang-17 --version
          else
            echo "flang-17 not found, but LLVM 17 core is installed."
          fi

      - name: Ensure 'text' dependency is defined
        run: |
          # package.yamlがある場合、shakeターゲットまたは依存関係に 'text' を追加
          if [ -f "package.yaml" ]; then
            echo "package.yaml detected. Appending 'text' dependency..."
            # package.yamlのグローバルなdependencies配下、またはshake実行ファイル配下にtextを追加
            # 単純かつ確実にするため、yamlのトップレベルのdependencies配下にtextを追記します。
            # YAMLのトップレベルにある dependencies: ブロックにインデントして挿入
            sed -i '/^dependencies:/a \  - text' package.yaml
            # また、各実行ファイルターゲット（shake等）のdependenciesにも追加
            sed -i '/shake:/,/^[^ ]/ { /dependencies:/a \      - text\n      - text-2.0.2' package.yaml } || true
          fi

          # hatsu-yakitori.cabalを直接編集し、executable shake または共通ビルド依存に追加
          if [ -f "hatsu-yakitori.cabal" ]; then
            echo "hatsu-yakitori.cabal detected. Injecting 'text' dependency into shake target..."
            # executable shake の build-depends ブロックを特定し、そこに text を流し込む
            # Cabalファイル内の build-depends: の後ろに text を差し込む
            sed -i 's/build-depends:/build-depends: text,/g' hatsu-yakitori.cabal
          fi

      - name: Setup GHC and Stack (manual)
        run: |
          # Ensure stack is available (it is pre-installed on ubuntu-latest)
          if ! command -v stack &> /dev/null; then
            echo "Stack not found, installing..."
            curl -sSL https://get.haskellstack.org/ | sh
          fi
          
          # Instruct Stack to setup GHC based on your stack.yaml resolver
          stack setup

      - name: Build shake target (non-interactive)
        run: |
          stack build :shake --no-terminal --color never

      - name: Run flang-dhall-emit and save output
        run: |
          stack exec -- shake flang-dhall-emit | tee flang-dhall-output.txt

      - name: Upload flang-dhall-output artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flang-dhall-output
          path: flang-dhall-output.txt

      - name: Fail on missing HYK011 diag
        run: |
          if ! grep -q "HYK011" flang-dhall-output.txt; then
            echo "error[HYK011E]: Expected HYK011 diag not found in flang-dhall-output.txt"
            exit 1
          fi