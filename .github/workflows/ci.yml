name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  push:
    branches:
      - feature/example/output_flang
    tags-ignore:
      - '*'
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

