name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'ats2/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  push:
    branches:
      - example/ats2_build/output_flang←smt2_theory
    tags-ignore:
      - '*'
    paths:
      - '.github/workflows/ci.yml'
      - 'core/**'
      - 'dist-proof/lean4/**'
      - 'examples/fmm/**'
      - 'modules/**'
      - 'ats2/**'
      - 'package.yaml'
      - 'hatsu-yakitori.cabal'
      - 'shake/**'
      - 'stack.yaml'
      - 'tests/fmm_tests.scm'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

