name: Agda CI

on:
  push:
    branches: [ "feature/sedenion_bridge_Agda" ]
  pull_request:
    branches: [ "feature/sedenion_bridge_Agda" ]

jobs:
  typecheck:
    name: Typecheck Agda Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Agda
        uses: agda/agda-setup-action@1432104f3a87f85ab4a5327caee9601dc8364274c3880258a8bc67515b03de4b
        with:
          agda-version: '2.8.0.1'
          agda-stdlib-version: '2.3'

      - name: Register project library
        run: |
          mkdir -p \~/.agda
          echo "$GITHUB_WORKSPACE/cayley-dickson-quiver.agda-lib" >> \~/.agda/libraries

      - name: Typecheck via Everything.agda
        run: |
          cd dist-proof/Agda
          agda src/Everything.agda
