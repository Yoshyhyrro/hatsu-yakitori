name: Agda CI

on:
  push:
    branches: [ "feature/sedenion_bridge_Agda" ]
  pull_request:
    branches: [ "feature/sedenion_bridge_Agda" ]

jobs:
  typecheck:
    name: Typecheck Agda Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Agda
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: "latest"
          agda-stdlib-version: "recommended"

      - name: Register project library
        run: |
          mkdir -p \~/.agda
          echo "$GITHUB_WORKSPACE/cayley-dickson-quiver.agda-lib" >> \~/.agda/libraries

      - name: Typecheck via Everything.agda
        run: |
          cd dist-proof/Agda
          agda src/Everything.agda