name: Agda CI

on:
  push:
    branches: [ "feature/sedenion_bridge_Agda" ]
  pull_request:
    branches: [ "feature/sedenion_bridge_Agda" ]

jobs:
  typecheck:
    name: Typecheck Agda Modules
    runs-on: ubuntu-latest
    
    # Agda + agda-stdlib がプリインストールされた公式イメージを使用
    container:
      image: index.docker.io/agda/agda:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Register Agda Libraries
        run: |
          mkdir -p ~/.agda
          
          # 1. 依存ライブラリ (agda-stdlib) のロード設定
          # Dockerイメージ内の agda-stdlib のパスを指定
          echo "standard-library" > ~/.agda/defaults
          echo "/usr/local/datadir/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          
          # 2. 自身の .agda-lib を Agda に認識させる (絶対パスで登録)
          echo "$GITHUB_WORKSPACE/cayley-dickson-quiver.agda-lib" >> ~/.agda/libraries

      - name: Typecheck via Everything.agda
        run: |
          # --library-path や .agda-lib の設定を自動読み込みして型チェック
          cd dist-proof\Agda
          agda src/Everything.agda
