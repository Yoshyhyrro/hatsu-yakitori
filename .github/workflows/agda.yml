name: Agda CI

on:
  push:
    branches: [ "feature/sedenion_bridge_Agda" ]
  pull_request:
    branches: [ "feature/sedenion_bridge_Agda" ]

jobs:
  typecheck:
    name: Typecheck Agda Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Agda
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881  # v1.0.0
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.3'

      - name: Register project library
        run: |
          mkdir -p \~/.agda
          echo "$GITHUB_WORKSPACE/cayley-dickson-quiver.agda-lib" >> \~/.agda/libraries

      - name: Typecheck via Everything.agda
        run: |
          cd dist-proof/Agda
          agda src/Everything.agda
