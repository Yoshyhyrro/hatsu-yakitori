name: Agda CI

on:
  push:
    branches: [ "feature/sedenion_bridge_Agda" ]
  pull_request:
    branches: [ "feature/sedenion_bridge_Agda" ]

jobs:
  typecheck:
    name: Typecheck Agda Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Agda
        uses: wenkokke/setup-agda@52f1e708494c8717630b3e1378383b01a56a379c # v2.5.0
        with:
          agda-version: "latest"
          agda-stdlib-version: "recommended"

      - name: Register project library
        run: |
          mkdir -p \~/.agda
          echo "$GITHUB_WORKSPACE/cayley-dickson-quiver.agda-lib" >> \~/.agda/libraries

      - name: Typecheck via Everything.agda
        run: |
          cd dist-proof/Agda
          agda src/Everything.agda